<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Ítalo Borges — Operações de TI e Produtos Digitais</title>
  <desc id="desc">Banner profissional em azul escuro com detalhes em ciano, apresentando Ítalo Borges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050C16"/>
      <stop offset="0.55" stop-color="#0A1B31"/>
      <stop offset="1" stop-color="#0B3150"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#67E8F9" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#grid)"/>
  <ellipse cx="1030" cy="112" rx="310" ry="270" fill="url(#glow)"/>
  <path d="M0 330C190 286 360 358 546 318S920 254 1200 303V380H0Z" fill="#071321" opacity=".78"/>

  <g opacity=".82">
    <path d="M712 284C770 216 831 234 878 177S978 86 1158 113" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="7 8"/>
    <path d="M742 319C829 273 905 299 958 237S1073 166 1202 188" fill="none" stroke="#38BDF8" stroke-opacity=".35"/>
    <g fill="#67E8F9" filter="url(#softGlow)">
      <circle cx="712" cy="284" r="4"/><circle cx="878" cy="177" r="4"/><circle cx="958" cy="237" r="4"/><circle cx="1158" cy="113" r="4"/>
    </g>
  </g>

  <g transform="translate(72 52)">
    <rect width="150" height="30" rx="15" fill="#0E7490" fill-opacity=".22" stroke="#22D3EE" stroke-opacity=".55"/>
    <circle cx="17" cy="15" r="4" fill="#22D3EE"/>
    <text x="31" y="20" fill="#A5F3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">BRASÍLIA • DF</text>
  </g>

  <g transform="translate(72 143)">
    <text fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">Ítalo Borges</text>
    <rect y="82" width="106" height="6" rx="3" fill="url(#accent)"/>
    <text y="123" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="2.2">OPERAÇÕES DE TI • SUPORTE • PRODUTOS DIGITAIS</text>
    <text y="167" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="17">Transformo demandas operacionais em soluções claras, seguras e utilizáveis.</text>
  </g>

  <g transform="translate(835 62)" filter="url(#shadow)">
    <rect width="285" height="230" rx="24" fill="#07111F" fill-opacity=".82" stroke="#38BDF8" stroke-opacity=".24"/>
    <rect x="22" y="20" width="241" height="32" rx="10" fill="#0F253B"/>
    <circle cx="41" cy="36" r="4" fill="#FB7185"/><circle cx="56" cy="36" r="4" fill="#FBBF24"/><circle cx="71" cy="36" r="4" fill="#34D399"/>
    <text x="91" y="41" fill="#64748B" font-family="Consolas, monospace" font-size="11">operations.console</text>
    <text x="26" y="84" fill="#22D3EE" font-family="Consolas, monospace" font-size="13">$ status --environment</text>
    <text x="26" y="112" fill="#E2E8F0" font-family="Consolas, monospace" font-size="13">availability</text>
    <text x="224" y="112" text-anchor="end" fill="#34D399" font-family="Consolas, monospace" font-size="13">24x7</text>
    <text x="26" y="140" fill="#E2E8F0" font-family="Consolas, monospace" font-size="13">support</text>
    <text x="224" y="140" text-anchor="end" fill="#60A5FA" font-family="Consolas, monospace" font-size="13">N1 / N2</text>
    <text x="26" y="168" fill="#E2E8F0" font-family="Consolas, monospace" font-size="13">monitoring</text>
    <text x="224" y="168" text-anchor="end" fill="#A5F3FC" font-family="Consolas, monospace" font-size="13">ONLINE</text>
    <path d="M26 198H102L118 182L137 210L153 190L169 198H240" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect y="372" width="1200" height="8" fill="url(#accent)"/>
</svg>
